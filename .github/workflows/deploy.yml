name: Deploy to GitHub Pages

on:
  push:
    branches: [master, main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Only one deployment at a time; a newer push cancels an in-flight run.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # npm ci is exact, but it refuses to run when package-lock.json lags
      # behind package.json (e.g. after a dependency bump without a local
      # `npm install`). Fall back to a plain install so a stale lockfile
      # cannot block a deploy, and surface it as a warning annotation.
      - name: Install dependencies
        run: |
          npm ci --no-audit --no-fund || {
            echo "::warning::package-lock.json is out of sync with package.json — falling back to npm install. Run \`npm install\` locally and commit the updated lockfile."
            npm install --no-audit --no-fund
          }

      # Project pages live under /<repo>/, user/org pages at the root.
      # Deriving it from the repo name keeps vite.config.js correct even if
      # the repository is renamed or forked.
      - name: Resolve Vite base path
        id: base
        run: |
          repo="${{ github.event.repository.name }}"
          if [[ "$repo" == *.github.io ]]; then
            echo "value=/" >> "$GITHUB_OUTPUT"
          else
            echo "value=/$repo/" >> "$GITHUB_OUTPUT"
          fi

      - name: Build
        env:
          VITE_BASE: ${{ steps.base.outputs.value }}
        run: npm run build

      # Pages would otherwise run the artifact through Jekyll.
      - name: Disable Jekyll processing
        run: touch build/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
